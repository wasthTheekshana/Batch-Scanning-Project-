<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOK Scanner Central Admin</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/dashboard/style.css">
</head>
<body>
  <div class="shell">
    <header class="side" id="top" hidden>
      <div class="brand">DOK Scanner <span>Central admin</span></div>
      <nav id="nav" aria-label="Sections">
        <a href="#/overview" data-view="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg><span>Overview</span><span class="count" id="alert-count" hidden></span></a>
        <a href="#/fleet" data-view="fleet"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>Fleet</span></a>
        <a href="#/activity" data-view="activity"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span>Activity</span></a>
        <a href="#/search" data-view="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span>Search</span></a>
        <a href="#/pcs" data-view="pcs"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="7" rx="2"/><rect x="4" y="14" width="16" height="7" rx="2"/><path d="M8 6.5h.01M8 17.5h.01"/></svg><span>PCs</span></a>
        <a href="#/projects" data-view="projects"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Projects</span></a>
        <a href="#/templates" data-view="templates"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span>Templates</span></a>
        <a href="#/admins" data-view="admins"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 20a6 6 0 0 0-3-5.2"/></svg><span>Admins</span></a>
        <a href="#/audit" data-view="audit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span>Audit log</span></a>
        <a href="#/settings" data-view="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="9.5" cy="17" r="2.3"/></svg><span>Settings</span></a>
      </nav>
      <div class="who">
        <span id="who-name"></span>
        <button type="button" id="change-password" class="link">Change password</button>
        <button type="button" id="sign-out" class="link">Sign out</button>
      </div>
    </header>

    <section id="login" class="login" hidden>
      <form id="login-form" class="card">
        <h1>Central admin</h1>
        <label>Username <input id="login-user" autocomplete="username" required maxlength="100"></label>
        <label>Password <input id="login-pass" type="password" autocomplete="current-password" required maxlength="200"></label>
        <p id="login-error" class="error" role="alert"></p>
        <button type="submit" class="primary">Sign in</button>
      </form>
    </section>

    <main id="view" hidden></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <noscript><p class="error">This page needs JavaScript.</p></noscript>
  <script src="/dashboard/form.js"></script>
  <script src="/dashboard/app.js"></script>
</body>
</html>
